services:
  redis:
    image: redis:7
    networks:
      - gojob-net
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 5

  worker:
    build: .
    networks:
      - gojob-net
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_ADDR: redis:6379

networks:
  gojob-net:
    driver: bridge