services:
  redis:
    image: redis:7
    networks:
      - gojob-net
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 5

  worker:
    build: .
    networks:
      - gojob-net
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_ADDR: redis:6379
    ports:
      - "2112:2112"

  prometheus:
    image: prom/prometheus:latest
    networks:
      - gojob-net
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - worker

  grafana:
    image: grafana/grafana:latest
    networks:
      - gojob-net
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

networks:
  gojob-net:
    driver: bridge

volumes:
  grafana-data: